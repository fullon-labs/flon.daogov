# Same-origin governance API. RPC and transaction signing remain separate.
location ^~ /api/v1/daogov/ {
    resolver 127.0.0.11 ipv6=off valid=60s;
    set $daogov_api_host testnet.flonscan.io;
    proxy_pass https://$daogov_api_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host testnet.flonscan.io;
    proxy_ssl_server_name on;
    proxy_ssl_name testnet.flonscan.io;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_intercept_errors off;
}
