services:
  daogov-mainnet:
    image: local/flon-daogov:${IMAGE_TAG:-latest}
    container_name: flon-daogov-mainnet
    restart: unless-stopped
    ports:
      - "127.0.0.1:20101:80"
    volumes:
      - ./config.mainnet.js:/usr/share/nginx/html/config.js:ro
      - ./community-api.conf:/etc/nginx/daogov/community-api.conf:ro

  daogov-testnet:
    image: local/flon-daogov:${IMAGE_TAG:-latest}
    container_name: flon-daogov-testnet
    restart: unless-stopped
    ports:
      - "127.0.0.1:20102:80"
    volumes:
      - ./config.testnet.js:/usr/share/nginx/html/config.js:ro
      - ./api.testnet.conf:/etc/nginx/daogov/api.conf:ro
      - ./community-api.conf:/etc/nginx/daogov/community-api.conf:ro

  community-api:
    image: local/flon-daogov-community-api:${IMAGE_TAG:-latest}
    container_name: flon-daogov-community-api
    restart: unless-stopped
    environment:
      PORT: "8789"
      GITHUB_OWNER: fullon-labs
      GITHUB_REPO: flon.daogov
      GITHUB_DISCUSSION_CATEGORY: General
      GITHUB_OAUTH_CALLBACK_URL: https://daogov.flon.network/community-api/v1/auth/github/callback
      SESSION_COOKIE_DOMAIN: .flon.network
      ALLOWED_ORIGINS: https://daogov.flon.network,https://daogov-t.flon.network
      GITHUB_CLIENT_ID_FILE: /run/secrets/github_oauth_client_id
      GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_oauth_client_secret
      SESSION_SECRET_FILE: /run/secrets/community_session_secret
    secrets:
      - github_oauth_client_id
      - github_oauth_client_secret
      - community_session_secret
    ports:
      - "127.0.0.1:20103:8789"

  daogov-keeper-mainnet:
    image: ghcr.io/fullon-labs/flon.daogov-keeper:${KEEPER_TAG:-0.2.0}
    container_name: flon-daogov-keeper-mainnet
    restart: unless-stopped
    environment:
      KEEPER_RPC_URL: https://m.flonscan.io
      KEEPER_CHAIN_ID: d4019d7d8633a337973408c6c00e5c4888933ad1b6ce10edddea8145317d8d12
      KEEPER_BROADCAST: "false"
      KEEPER_HEALTH_PORT: "8788"
    ports:
      - "127.0.0.1:20111:8788"

  daogov-keeper-testnet:
    image: ghcr.io/fullon-labs/flon.daogov-keeper:${KEEPER_TAG:-0.2.0}
    container_name: flon-daogov-keeper-testnet
    restart: unless-stopped
    environment:
      KEEPER_RPC_URL: http://47.237.17.245:19889
      KEEPER_CHAIN_ID: 18b4d5837d83a8f7203ea57cb7ab37b9cef59547ea307e70b1bf1103cb06043f
      KEEPER_BROADCAST: "true"
      KEEPER_SIGNER_ACTOR: epoch.keeper
      KEEPER_SIGNER_PERMISSION: claimer
      KEEPER_PRIVATE_KEY_FILE: /run/secrets/testnet_keeper_key
      KEEPER_MAX_STEPS: "24"
      KEEPER_POLL_MS: "3600000"
      KEEPER_HEALTH_PORT: "8788"
    secrets:
      - testnet_keeper_key
    ports:
      - "127.0.0.1:20112:8788"

secrets:
  testnet_keeper_key:
    file: /data/flon-daogov/secrets/testnet-epoch-keeper.key
  github_oauth_client_id:
    file: /data/flon-daogov/secrets/github-oauth-client-id
  github_oauth_client_secret:
    file: /data/flon-daogov/secrets/github-oauth-client-secret
  community_session_secret:
    file: /data/flon-daogov/secrets/community-session-secret
