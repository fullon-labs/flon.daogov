<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FULLON · BP 配置</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>添加观察节点</h1><p>配置保存在 SQLite。未验证目标最多观察 30 分钟，到期删除配置和历史；只有有效 BP 且端点归属核验通过才允许长期观察。管理端仅监听本机。</p><form id="form"><label>记录 ID<input name="id" required pattern="[a-z0-9][a-z0-9-]{0,63}" placeholder="testnet-einstein"></label><label>显示名称<input name="label" maxlength="100"></label><label>BP account<input name="producer" required pattern="[a-z1-5.]{1,12}" placeholder="einstein"></label><label>网络<select name="network"><option value="testnet">测试网</option><option value="mainnet">主网</option></select></label><label>完整 Chain ID<input name="chainId" required pattern="[a-f0-9]{64}"></label><label>RPC URL（可填 IP:Port 的完整 URL）<input name="rpc" type="url" required placeholder="http://IP:8888"></label><label>RPC 来源<select name="rpcScope"><option value="reference">公共观察 RPC（不证明 BP 自身同步）</option><option value="bp">属于此 BP 的 RPC（此声明不授予长期资格）</option></select></label><label>参考 RPC（可选，同链独立节点）<input name="referenceRpc" type="url"></label><label>P2P IP（可选）<input name="p2pHost" placeholder="IPv4 或 IPv6"></label><label>P2P Port<input name="p2pPort" type="number" min="1" max="65535"></label><p>新增时使用唯一 ID。P2P 仅检查 TCP 可达性；不表示签名服务就绪。</p><button>保存并开始观察</button><output id="result" aria-live="polite"></output></form><h2>已配置记录</h2><div id="list"></div></main><script src="/admin.js" type="module"></script></body></html>
