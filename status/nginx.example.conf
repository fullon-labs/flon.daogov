# Install after DNS points to the chosen host and TLS certificates exist.
# Replace certificate paths with the paths provided by your ACME client.
server {
    listen 80;
    server_name status.flon.network;
    return 301 https://status.flon.network$request_uri;
}
server {
    listen 443 ssl;
    server_name status.flon.network;
    ssl_certificate /etc/letsencrypt/live/status.flon.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.flon.network/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
