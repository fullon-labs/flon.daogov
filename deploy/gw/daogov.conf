server {
    listen 80;
    listen [::]:80;
    server_name daogov.flon.network daogov-t.flon.network;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daogov.flon.network;

    ssl_certificate /etc/letsencrypt/live/daogov.flon.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daogov.flon.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daogov-t.flon.network;

    ssl_certificate /etc/letsencrypt/live/daogov.flon.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daogov.flon.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
